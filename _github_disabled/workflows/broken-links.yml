name: Broken Link Check

# Weekly: scan every listing's externalUrl and repoUrl. If any return
# non-2xx, open an issue with the details.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Scan for broken links
        run: node scripts/broken-links.mjs

      - name: Open issue if broken links found
        if: hashFiles('data/broken-links.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('data/broken-links.json', 'utf8'));
            if (data.length === 0) return;
            const body = data.map(d =>
              `- **${d.name}** (\`${d.slug}\`): \`${d.url}\` returned ${d.status || d.error}`
            ).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Broken link check: ${data.length} issue${data.length === 1 ? '' : 's'} found`,
              body: `Weekly broken link scan found the following issues:\n\n${body}\n\n---\n\n*Auto-generated by GitHub Actions.*`,
              labels: ['broken-link', 'automated'],
            });
